requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pymupdf>=1.24.0",
  "pillow>=10.0.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "mcp>=1.0.0",
  "ultralytics>=8.3.0",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "opencv-python-headless>=4.8.0",
  "groundingdino-py>=0.4.0",
  "transformers>=4.36.0,<4.41",
]
[tool.uvicorn]
factory = false
